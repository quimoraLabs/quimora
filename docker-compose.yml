services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quimora_app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/quimora
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-quimora_development_secret_key_change_in_prod}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - IMAGEKIT_PUBLIC_KEY=${IMAGEKIT_PUBLIC_KEY:-}
      - IMAGEKIT_PRIVATE_KEY=${IMAGEKIT_PRIVATE_KEY:-}
      - IMAGEKIT_URL_ENDPOINT=${IMAGEKIT_URL_ENDPOINT:-}
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7.0
    container_name: quimora_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: quimora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
